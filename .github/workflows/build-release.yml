name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and package without game installation
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          ./package.ps1 -Version $version -Locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BD2Fishing-win-x64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download build assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name BD2Fishing-win-x64 --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "BD2 Fishing $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
